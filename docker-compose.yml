name: codex-gateway

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  restart: unless-stopped

services:
  cloudflared:
    <<: *common-security
    image: ${CLOUDFLARED_IMAGE:?Run ./scripts/lock-images.sh first}
    read_only: true
    user: "65532:${GATEWAY_SECRET_GID:-1000}"
    init: true
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_tunnel_token
    secrets:
      - cloudflared_tunnel_token
    networks:
      tunnel_external: {}
      edge_internal:
        ipv4_address: 172.28.10.4
    depends_on:
      caddy:
        condition: service_healthy
    cap_drop:
      - ALL

  caddy:
    <<: *common-security
    image: ${CADDY_IMAGE:?Run ./scripts/lock-images.sh first}
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge_internal:
        ipv4_address: 172.28.10.2
    depends_on:
      gateway:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    <<: *common-security
    image: codex-gateway-gateway:${GATEWAY_IMAGE_TAG:?Set GATEWAY_IMAGE_TAG in .env}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:?Run ./scripts/lock-images.sh first}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Run ./scripts/lock-images.sh first}
        VERSION: ${GATEWAY_VERSION:?Set GATEWAY_VERSION in .env}
        REVISION: ${GATEWAY_REVISION:?Set GATEWAY_REVISION in .env}
    read_only: true
    user: "10001:${GATEWAY_SECRET_GID:-1000}"
    init: true
    environment:
      GATEWAY_LISTEN: ":8080"
      GATEWAY_PUBLIC_URL: https://${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
      GATEWAY_USAGE_PRICING_JSON: ${GATEWAY_USAGE_PRICING_JSON:?Set GATEWAY_USAGE_PRICING_JSON in .env}
      TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-172.28.10.2/32}
      DATABASE_URL_FILE: /run/secrets/database_url
      KEY_HMAC_PEPPER_FILE: /run/secrets/gateway_api_key_pepper
      TOKEN_HMAC_PEPPER_FILE: /run/secrets/gateway_session_secret
      SIDECAR_URL: http://codex-compat:8317
      SIDECAR_API_KEY_FILE: /run/secrets/sidecar_api_key
      GATEWAY_BODY_LIMIT_BYTES: "67108864"
    secrets:
      - database_url
      - gateway_api_key_pepper
      - gateway_session_secret
      - sidecar_api_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=10001,gid=10001
    networks:
      edge_internal:
        ipv4_address: 172.28.10.3
      data_internal:
        ipv4_address: 172.28.20.2
      compat_internal:
        ipv4_address: 172.28.30.2
    depends_on:
      postgres:
        condition: service_healthy
      codex-compat:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    <<: *common-security
    image: ${POSTGRES_IMAGE:?Run ./scripts/lock-images.sh first}
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - shared_preload_libraries=
    secrets:
      - source: postgres_password
        mode: 0400
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      data_internal:
        ipv4_address: 172.28.20.3
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U gateway -d gateway"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  codex-compat:
    <<: *common-security
    image: codex-gateway-compat:v7.2.127-ecc9aa72
    build:
      context: .
      dockerfile: deploy/codex-compat/Dockerfile
      args:
        GOLANG_IMAGE: ${CLIPROXY_GOLANG_IMAGE:?Run ./scripts/lock-images.sh first}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Run ./scripts/lock-images.sh first}
        CLIPROXY_VERSION: v7.2.127
        CLIPROXY_COMMIT: ecc9aa72b32f34b680d03b0724b531a21ae74472
    read_only: true
    user: "10001:${GATEWAY_SECRET_GID:-1000}"
    init: true
    environment:
      CLIPROXY_AUTH_DIR: /var/lib/cliproxy/oauth
      CLIPROXY_LISTEN_ADDR: 0.0.0.0
      CLIPROXY_PORT: "8317"
      CLIPROXY_API_KEY_FILE: /run/secrets/sidecar_api_key
      CLIPROXY_PROXY_URL: http://egress-allowlist:3128
      HTTP_PROXY: http://egress-allowlist:3128
      HTTPS_PROXY: http://egress-allowlist:3128
      ALL_PROXY: http://egress-allowlist:3128
      NO_PROXY: 127.0.0.1,localhost,codex-compat
      CODEX_SMOKE_MODEL: ${CODEX_SMOKE_MODEL:-gpt-5-codex}
    secrets:
      - sidecar_api_key
    volumes:
      - type: volume
        source: codex_oauth
        target: /var/lib/cliproxy/oauth
        volume:
          nocopy: false
    tmpfs:
      - /run/cliproxy:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
    networks:
      compat_internal:
        ipv4_address: 172.28.30.3
    depends_on:
      egress-allowlist:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/sidecar-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  egress-allowlist:
    <<: *common-security
    image: ${SQUID_IMAGE:?Run ./scripts/lock-images.sh first}
    read_only: true
    volumes:
      - ./deploy/egress/squid.conf:/etc/squid/squid.conf:ro
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=8m
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,mode=0750,uid=13,gid=13
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=64m,mode=0750,uid=13,gid=13
    networks:
      egress_external: {}
      compat_internal:
        ipv4_address: 172.28.30.4
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/squid.pid && kill -0 $$(cat /run/squid.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  tunnel_external:
    driver: bridge
  edge_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  data_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
  compat_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  egress_external:
    driver: bridge

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  codex_oauth: {}

secrets:
  cloudflared_tunnel_token:
    file: ./deploy/secrets/cloudflared_tunnel_token
  database_url:
    file: ./deploy/secrets/database_url
  postgres_password:
    file: ./deploy/secrets/postgres_password
  gateway_api_key_pepper:
    file: ./deploy/secrets/gateway_api_key_pepper
  gateway_session_secret:
    file: ./deploy/secrets/gateway_session_secret
  sidecar_api_key:
    file: ./deploy/secrets/sidecar_api_key
