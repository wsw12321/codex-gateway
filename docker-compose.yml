name: codex-gateway

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  restart: unless-stopped

services:
  cloudflared:
    <<: *common-security
    image: ${CLOUDFLARED_IMAGE:?Run ./scripts/lock-images.sh first}
    read_only: true
    user: "65532:${GATEWAY_SECRET_GID:-1000}"
    init: true
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflared_tunnel_token
    secrets:
      - cloudflared_tunnel_token
    networks:
      tunnel_external: {}
      edge_internal:
        ipv4_address: 172.28.10.4
    depends_on:
      caddy:
        condition: service_healthy
    cap_drop:
      - ALL

  caddy:
    <<: *common-security
    image: ${CADDY_IMAGE:?Run ./scripts/lock-images.sh first}
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge_internal:
        ipv4_address: 172.28.10.2
    depends_on:
      gateway:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    <<: *common-security
    image: codex-gateway-gateway:${GATEWAY_IMAGE_TAG:?Set GATEWAY_IMAGE_TAG in .env}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:?Run ./scripts/lock-images.sh first}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Run ./scripts/lock-images.sh first}
        VERSION: ${GATEWAY_VERSION:?Set GATEWAY_VERSION in .env}
        REVISION: ${GATEWAY_REVISION:?Set GATEWAY_REVISION in .env}
    read_only: true
    user: "10001:${GATEWAY_SECRET_GID:-1000}"
    init: true
    environment:
      GATEWAY_LISTEN: ":8080"
      GATEWAY_PUBLIC_URL: https://${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
      GATEWAY_USAGE_PRICING_JSON: ${GATEWAY_USAGE_PRICING_JSON:?Set GATEWAY_USAGE_PRICING_JSON in .env}
      TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-172.28.10.2/32}
      DATABASE_URL_FILE: /run/secrets/database_url
      KEY_HMAC_PEPPER_FILE: /run/secrets/gateway_api_key_pepper
      API_KEY_ENCRYPTION_KEY_FILE: /run/secrets/gateway_api_key_encryption_key
      TOKEN_HMAC_PEPPER_FILE: /run/secrets/gateway_session_secret
      SIDECAR_URL: http://codex-compat:8317
      SIDECAR_API_KEY_FILE: /run/secrets/sidecar_api_key
      ANTIGRAVITY_BRIDGE_URL: http://antigravity-bridge:8318
      ANTIGRAVITY_BRIDGE_API_KEY_FILE: /run/secrets/antigravity_bridge_api_key
      ANTIGRAVITY_MODEL_ROUTES_JSON: ${ANTIGRAVITY_MODEL_ROUTES_JSON:-}
      GATEWAY_BODY_LIMIT_BYTES: "67108864"
      LIMIT_KEY_CONCURRENT: "${LIMIT_KEY_CONCURRENT:-16}"
      LIMIT_USER_CONCURRENT: "${LIMIT_USER_CONCURRENT:-16}"
      LIMIT_GLOBAL_CONCURRENT: "${LIMIT_GLOBAL_CONCURRENT:-32}"
    secrets:
      - database_url
      - gateway_api_key_encryption_key
      - gateway_api_key_pepper
      - gateway_session_secret
      - sidecar_api_key
      - antigravity_bridge_api_key
    tmpfs:
      # Four concurrent 64 MiB request spools plus one body-sized margin for
      # filesystem/accounting overhead and cleanup overlap.
      - /tmp:rw,noexec,nosuid,nodev,size=320m,mode=0700,uid=10001,gid=10001
    networks:
      edge_internal:
        ipv4_address: 172.28.10.3
      data_internal:
        ipv4_address: 172.28.20.2
      compat_internal:
        ipv4_address: 172.28.30.2
      antigravity_internal:
        ipv4_address: 172.28.40.2
    depends_on:
      postgres:
        condition: service_healthy
      codex-compat:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    <<: *common-security
    image: ${POSTGRES_IMAGE:?Run ./scripts/lock-images.sh first}
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - shared_preload_libraries=
    secrets:
      - source: postgres_password
        mode: 0400
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      data_internal:
        ipv4_address: 172.28.20.3
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U gateway -d gateway"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  codex-compat:
    <<: *common-security
    image: codex-gateway-compat:v7.2.150-c77b1369-eaefd05c4c478e73-codex-only
    build:
      context: .
      dockerfile: deploy/codex-compat/Dockerfile
      args:
        GOLANG_IMAGE: ${CLIPROXY_GOLANG_IMAGE:?Run ./scripts/lock-images.sh first}
        RUNTIME_IMAGE: ${CLIPROXY_RUNTIME_IMAGE:?Run ./scripts/lock-images.sh first}
        CLIPROXY_VERSION: v7.2.150
        CLIPROXY_COMMIT: c77b13694318b0897f2c74104ef48aebdf8c34d6
    read_only: true
    user: "10001:${GATEWAY_SECRET_GID:-1000}"
    init: true
    environment:
      CLIPROXY_AUTH_DIR: /var/lib/cliproxy/oauth
      CLIPROXY_LISTEN_ADDR: 0.0.0.0
      CLIPROXY_PORT: "8317"
      CLIPROXY_API_KEY_FILE: /run/secrets/sidecar_api_key
      CLIPROXY_PROXY_URL: http://egress-allowlist:3128
      HTTP_PROXY: http://egress-allowlist:3128
      HTTPS_PROXY: http://egress-allowlist:3128
      ALL_PROXY: http://egress-allowlist:3128
      NO_PROXY: 127.0.0.1,localhost,codex-compat,gateway
      CODEX_SMOKE_MODEL: ${CODEX_SMOKE_MODEL:-gpt-5-codex}
    secrets:
      - sidecar_api_key
    volumes:
      - type: volume
        source: codex_oauth
        target: /var/lib/cliproxy/oauth
        volume:
          nocopy: false
    tmpfs:
      - /run/cliproxy:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
    networks:
      compat_internal:
        ipv4_address: 172.28.30.3
    depends_on:
      egress-allowlist:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/sidecar-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  antigravity-bridge:
    <<: *common-security
    image: codex-gateway-antigravity:agy1.2.4-${GATEWAY_IMAGE_TAG:?Set GATEWAY_IMAGE_TAG in .env}
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/antigravity-bridge/Dockerfile
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:?Run ./scripts/lock-images.sh first}
        RUNTIME_IMAGE: ${CLIPROXY_RUNTIME_IMAGE:?Run ./scripts/lock-images.sh first}
    read_only: true
    user: "10002:${GATEWAY_SECRET_GID:-1000}"
    init: true
    pids_limit: 128
    environment:
      ANTIGRAVITY_BRIDGE_LISTEN: ":8318"
      ANTIGRAVITY_BRIDGE_API_KEY_FILE: /run/secrets/antigravity_bridge_api_key
      ANTIGRAVITY_MODEL_ROUTES_JSON: '{"gemini-3.1-pro-preview":"gemini-3.1-pro-high"}'
      AGY_BINARY: /usr/local/bin/agy
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"
      HTTP_PROXY: http://egress-allowlist:3128
      HTTPS_PROXY: http://egress-allowlist:3128
      ALL_PROXY: http://egress-allowlist:3128
      NO_PROXY: 127.0.0.1,localhost,antigravity-bridge
    secrets:
      - antigravity_bridge_api_key
      - antigravity_keyring_password
    volumes:
      - type: volume
        source: antigravity_keyring
        target: /var/lib/antigravity/keyrings
        volume:
          nocopy: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10002,gid=10002
      - /run/antigravity:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10002,gid=10002
    networks:
      antigravity_internal:
        ipv4_address: 172.28.40.3
    depends_on:
      egress-allowlist:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8318/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  egress-allowlist:
    <<: *common-security
    image: ${SQUID_IMAGE:?Run ./scripts/lock-images.sh first}
    read_only: true
    entrypoint: ["/usr/local/bin/codex-egress-entrypoint.sh"]
    # An explicit entrypoint clears the image CMD in Compose; preserve it here.
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    environment:
      CODEX_RELAY_IP: ${CODEX_RELAY_IP:-}
      CODEX_RELAY_PORT: "${CODEX_RELAY_PORT:-3128}"
    volumes:
      - ./deploy/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./deploy/egress/entrypoint.sh:/usr/local/bin/codex-egress-entrypoint.sh:ro
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=8m
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,mode=0750,uid=13,gid=13
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=64m,mode=0750,uid=13,gid=13
    networks:
      egress_external: {}
      compat_internal:
        ipv4_address: 172.28.30.4
      antigravity_internal:
        ipv4_address: 172.28.40.4
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/squid.pid && kill -0 $$(cat /run/squid.pid)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  tunnel_external:
    driver: bridge
  edge_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  data_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
  compat_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  antigravity_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.40.0/24
  egress_external:
    driver: bridge

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  codex_oauth: {}
  antigravity_keyring: {}

secrets:
  cloudflared_tunnel_token:
    file: ./deploy/secrets/cloudflared_tunnel_token
  database_url:
    file: ./deploy/secrets/database_url
  postgres_password:
    file: ./deploy/secrets/postgres_password
  gateway_api_key_pepper:
    file: ./deploy/secrets/gateway_api_key_pepper
  gateway_api_key_encryption_key:
    file: ./deploy/secrets/gateway_api_key_encryption_key
  gateway_session_secret:
    file: ./deploy/secrets/gateway_session_secret
  sidecar_api_key:
    file: ./deploy/secrets/sidecar_api_key
  antigravity_bridge_api_key:
    file: ./deploy/secrets/antigravity_bridge_api_key
  antigravity_keyring_password:
    file: ./deploy/secrets/antigravity_keyring_password
