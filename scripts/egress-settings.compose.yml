# Read only by the wrapper's `config --format json` call. Compose owns .env
# quoting/interpolation; this service is never created or started.
services:
  egress-settings:
    image: scratch
    environment:
      EGRESS_MODE: ${EGRESS_MODE:-}
      CODEX_RELAY_IP: ${CODEX_RELAY_IP:-}
      CODEX_RELAY_PORT: ${CODEX_RELAY_PORT:-3128}
      SHADOWSOCKS_SERVER: ${SHADOWSOCKS_SERVER:-}
      SHADOWSOCKS_PORT: ${SHADOWSOCKS_PORT:-}
      SHADOWSOCKS_CIPHER: ${SHADOWSOCKS_CIPHER:-aes-128-gcm}
      SHADOWSOCKS_PASSWORD_FILE: ${SHADOWSOCKS_PASSWORD_FILE:-}
      GATEWAY_SECRET_GID: ${GATEWAY_SECRET_GID:-1000}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUTH_HOST: ${OIDC_AUTH_HOST:-}
