name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.11'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify canonical database migrations are tracked
        shell: bash
        run: |
          set -eu
          found=0
          for migration in internal/store/migrations/*.sql; do
            test -f "$migration" || continue
            found=1
            git ls-files --error-unmatch -- "$migration" >/dev/null || {
              printf 'canonical migration is not tracked: %s\n' "$migration" >&2
              exit 1
            }
            if git check-ignore --quiet --no-index -- "$migration"; then
              printf 'canonical migration is ignored: %s\n' "$migration" >&2
              exit 1
            fi
          done
          test "$found" -eq 1 || {
            printf '%s\n' 'no canonical migrations found' >&2
            exit 1
          }
      - name: Verify Go toolchain sources agree
        shell: bash
        run: |
          set -eu
          test "$(sed -n 's/^toolchain go//p' go.mod)" = "$GO_VERSION"
          test "$(jq -r .go_version deploy/codex-compat/plugin.lock.json)" = "$GO_VERSION"
          test "$(sed -n 's/^GO_VERSION=//p' deploy/shadowsocks/upstream/source.lock.env)" = "$GO_VERSION"
          go_image="docker.io/library/golang:${GO_VERSION}-bookworm"
          grep -Fxq "GOLANG_IMAGE|$go_image" deploy/images.sources
          grep -Fxq "CLIPROXY_GOLANG_IMAGE|$go_image" deploy/images.sources
          locked_go_image=$(sed -n 's/^GOLANG_IMAGE=//p' deploy/images.lock.env)
          test "${locked_go_image%@sha256:*}" = "$go_image"
          test "$(sed -n 's/^CLIPROXY_GOLANG_IMAGE=//p' deploy/images.lock.env)" = "$locked_go_image"
          for dockerfile in Dockerfile deploy/codex-compat/plugin.Dockerfile; do
            grep -Fxq "ARG GOLANG_IMAGE=$locked_go_image" "$dockerfile"
          done
      - name: Install locked Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Formatting
        shell: bash
        run: |
          set -eu
          test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      # The CPA plugin is a separate Go module, so ./... above does not reach it.
      # Its end-to-end suite needs a CPA binary and runs in the image build.
      - name: CPA plugin vet, unit tests and race detector
        working-directory: deploy/codex-compat/plugin
        shell: bash
        run: |
          set -eu
          go vet ./...
          go vet -tags e2e ./...
          go test -count=1 ./...
          go test -race -count=1 ./...

  postgres-integration:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        postgres_image:
          - docker.io/library/postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=gateway --dbname=gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify PostgreSQL service matches deployment lock
        shell: bash
        env:
          CI_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
        run: |
          set -eu
          test "$(sed -n 's/^POSTGRES_IMAGE=//p' deploy/images.lock.env)" = "$CI_POSTGRES_IMAGE"
      - name: Install locked Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: PostgreSQL integration tests
        shell: bash
        env:
          TEST_DATABASE_URL: postgres://gateway:integration-only-password@127.0.0.1:5432/gateway_test?sslmode=disable
        run: |
          set -euo pipefail
          test_output=$(mktemp)
          trap 'rm -f "$test_output"' EXIT
          if go test -count=1 -tags=integration ./internal/store ./internal/server 2>&1 | tee "$test_output"; then
            exit 0
          fi
          while IFS= read -r line; do
            case "$line" in
              *'--- FAIL:'*|*'_test.go:'*)
                message=${line//%/%25}
                message=${message//$'\r'/%0D}
                printf '::error title=PostgreSQL integration test::%s\n' "$message"
                ;;
            esac
          done < "$test_output"
          exit 1

  go-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: scripts/ci-go-tool.sh golang.org/x/vuln/cmd/govulncheck@v1.1.4 -- ./...
      # gosec walks directories, not modules. From the root it cannot resolve
      # the CPA plugin module's imports, reports type errors and fails with no
      # findings, so the plugin is scanned from inside its module below.
      - name: gosec
        run: scripts/ci-go-tool.sh github.com/securego/gosec/v2/cmd/gosec@v2.22.8 -- -exclude-dir=deploy/codex-compat/plugin ./...
      - name: govulncheck (CPA plugin)
        working-directory: deploy/codex-compat/plugin
        run: ../../../scripts/ci-go-tool.sh golang.org/x/vuln/cmd/govulncheck@v1.1.4 -- ./...
      # cgo rewrites the C ABI shim (main.go) into generated files. Without
      # -exclude-generated gosec flags cgo's own wrappers; with it gosec skips
      # the shim and covers the internal packages only. Keep the shim minimal:
      # its length conversions are bounded by maxMessageBytes.
      - name: gosec (CPA plugin)
        working-directory: deploy/codex-compat/plugin
        run: ../../../scripts/ci-go-tool.sh github.com/securego/gosec/v2/cmd/gosec@v2.22.8 -- -exclude-generated ./...

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: License policy
        run: >-
          scripts/ci-go-tool.sh github.com/google/go-licenses@v1.6.0 -- check ./...
          --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0
      - name: Verify upstream notices and immutable sources
        shell: bash
        run: |
          set -eu
          lock=deploy/codex-compat/plugin.lock.json
          grep -q "CLIProxyAPI $(jq -er .tag "$lock")" THIRD_PARTY_NOTICES
          grep -q "$(jq -er .commit "$lock")" THIRD_PARTY_NOTICES
          grep -q "$(jq -er .commit "$lock")" docker-compose.yml
          test ! -e scripts/gemini-login.sh
          test ! -e deploy/codex-compat/cliproxy-v7.2.150-gemini.patch
          test ! -e deploy/codex-compat/gemini-cli-19d9868-gateway.patch
          # The source-patched CPA image and the Antigravity bridge were
          # removed; neither may come back through a stray file.
          test ! -e deploy/codex-compat/Dockerfile
          test ! -e deploy/patch-cpa.override.yml
          test ! -e deploy/antigravity-bridge
          if grep -Eq 'GEMINI_PLUGIN|geminicli-login|gemini-cli[.]so|cpa-plugin-gemini-cli' \
            deploy/codex-compat/plugin.Dockerfile deploy/codex-compat/plugin-entrypoint.sh docker-compose.yml; then
            printf '%s\n' 'retired Gemini plugin path remains in the deployable configuration' >&2
            exit 1
          fi
      - name: Generate CycloneDX SBOM
        run: >-
          scripts/ci-go-tool.sh github.com/anchore/syft/cmd/syft@v1.30.0 --
          dir:. -o cyclonedx-json=sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  containers:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install deployment validation tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --yes jq skopeo python3
      - name: Verify committed image locks
        shell: bash
        run: |
          set -eu
          ./scripts/lock-images.sh --check
      - name: Create non-production CI configuration
        shell: bash
        run: |
          set -eu
          cp deploy/env.example .env
          ci_revision=$GITHUB_SHA
          ci_secret_gid=$(id -g)
          sed -i \
            -e 's/^GATEWAY_DOMAIN=.*/GATEWAY_DOMAIN=codex.ci.invalid/' \
            -e "s/^GATEWAY_IMAGE_TAG=.*/GATEWAY_IMAGE_TAG=$ci_revision/" \
            -e "s/^GATEWAY_VERSION=.*/GATEWAY_VERSION=$ci_revision/" \
            -e "s/^GATEWAY_REVISION=.*/GATEWAY_REVISION=$ci_revision/" \
            -e "s/^GATEWAY_SECRET_GID=.*/GATEWAY_SECRET_GID=$ci_secret_gid/" \
            .env
          ./scripts/bootstrap-secrets.sh
          printf '%s\n' 'ci-non-production-tunnel-token' > \
            deploy/secrets/cloudflared_tunnel_token
          chmod 0640 deploy/secrets/cloudflared_tunnel_token
      - name: Shell syntax
        shell: bash
        run: |
          set -eu
          for script in scripts/*.sh deploy/codex-compat/*.sh deploy/egress/*.sh deploy/shadowsocks/upstream/*.sh deploy/relay/wg-codex; do
            case "$(sed -n '1p' "$script")" in
              '#!/bin/sh') sh -n "$script" ;;
              '#!/sbin/openrc-run') sh -n "$script" ;;
              '#!/usr/bin/env bash') bash -n "$script" ;;
              *) printf 'unsupported shell shebang: %s\n' "$script" >&2; exit 1 ;;
            esac
          done
      - name: Compose syntax and deployment policy
        shell: bash
        run: |
          set -eu
          ci_env_backup=$(mktemp)
          cp .env "$ci_env_backup"
          trap 'cp "$ci_env_backup" .env; rm -f "$ci_env_backup"' EXIT
          printf '%s\n' 'synthetic-ci-shadowsocks-password' > deploy/secrets/shadowsocks_password
          printf '%s\n' 'synthetic-ci-oidc-client-secret' > deploy/secrets/oidc_client_secret
          chmod 0640 deploy/secrets/shadowsocks_password deploy/secrets/oidc_client_secret
          for mode in direct relay shadowsocks; do
            cp "$ci_env_backup" .env
            sed -i \
              -e "s/^EGRESS_MODE=.*/EGRESS_MODE=$mode/" \
              -e 's/^CODEX_RELAY_IP=.*/CODEX_RELAY_IP=10.77.0.2/' \
              -e 's/^SHADOWSOCKS_SERVER=.*/SHADOWSOCKS_SERVER=192.0.2.1/' \
              .env
            ./scripts/validate-compose.sh
            ./scripts/compose.sh config --quiet
            sed -i \
              -e 's/^OIDC_ENABLED=.*/OIDC_ENABLED=true/' \
              -e 's|^OIDC_ISSUER=.*|OIDC_ISSUER=https://auth.ci.invalid/auth/v1|' \
              -e 's/^OIDC_AUTH_HOST=.*/OIDC_AUTH_HOST=auth.ci.invalid/' \
              -e 's/^OIDC_CLIENT_ID=.*/OIDC_CLIENT_ID=synthetic-ci-client/' \
              .env
            ./scripts/validate-compose.sh --oidc
          done
          # An .env that still selects the removed source-patched image must
          # stop every Compose call.
          cp "$ci_env_backup" .env
          printf '%s\n' 'CPA_INTEGRATION=patch' >> .env
          if ./scripts/compose.sh config --quiet; then
            printf '%s\n' 'the removed source-patched CPA image was accepted' >&2
            exit 1
          fi
      - name: Deployment and login regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Verify relay routing, fail-closed behavior and streaming
        run: ./scripts/test-relay-image.sh
      - name: Verify Shadowsocks AEAD routing, isolation and streaming
        run: ./scripts/test-shadowsocks-image.sh
      - name: Build immutable application images
        shell: bash
        run: |
          set -euo pipefail
          build_output=$(mktemp)
          trap 'rm -f "$build_output"' EXIT
          if ./scripts/compose.sh --progress plain build gateway codex-compat account-egress 2>&1 | tee "$build_output"; then
            exit 0
          fi
          while IFS= read -r line; do
            case "$line" in
              *'--- FAIL:'*|*'.go:'*|*'FAIL'*|*'ERROR:'*|*'panic:'*|*'WARNING: DATA RACE'*)
                message=${line//%/%25}
                message=${message//$'\r'/%0D}
                printf '::error title=Application image build::%s\n' "$message"
                ;;
            esac
          done < "$build_output"
          exit 1
      - name: Verify per-account Shadowsocks routing and hot updates
        run: ./scripts/test-account-egress-image.sh codex-gateway-account-egress:1.19.32-v2
      # Unmodified CPA with the Gateway plugin; it was built with the
      # application images, and the build itself ran the plugin's end-to-end
      # suite against the binary it ships.
      - name: Verify CPA image
        shell: bash
        run: |
          set -euo pipefail
          lock=deploy/codex-compat/plugin.lock.json
          plugin_image=$(jq -er .image "$lock")
          merged=$(./scripts/compose.sh config --format json)
          jq -e --arg image "$plugin_image" '
            .services["codex-compat"].image == $image and
            (.services["codex-compat"].build.dockerfile | endswith("plugin.Dockerfile")) and
            .services["codex-compat"].environment.TMPDIR == "/run/cliproxy-plugin" and
            .services["codex-compat"].environment.HTTPS_PROXY == null and
            ([.services["codex-compat"].tmpfs[] | select(startswith("/tmp:"))] | length == 1) and
            ([.services["codex-compat"].tmpfs[] | select(startswith("/run/cliproxy-plugin:"))] | length == 1)
          ' <<<"$merged" >/dev/null
          ./scripts/test-cpa-plugin-image.sh "$plugin_image"
      - name: Scan application images with digest-locked Trivy
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . deploy/images.lock.env
          . ./.env
          set +a
          compat_image=$(./scripts/compose.sh config --format json | jq -er '.services["codex-compat"].image')
          account_egress_image=$(./scripts/compose.sh config --format json | jq -er '.services["account-egress"].image')
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL "codex-gateway-gateway:$GATEWAY_IMAGE_TAG"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL "$compat_image"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL "$account_egress_image"
      - name: Export tested images for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bundle=$RUNNER_TEMP/ci-images
          mkdir -p "$bundle"
          ./scripts/compose.sh config --format json | jq '{
            gateway: .services.gateway.image,
            "codex-compat": .services["codex-compat"].image,
            "account-egress": .services["account-egress"].image
          }' > "$bundle/local-images.json"
          mapfile -t images < <(jq -er '.[]' "$bundle/local-images.json")
          docker save "${images[@]}" | gzip -1 > "$bundle/images.tar.gz"
      - name: Upload tested image bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/ci-images/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish-images:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [go-test, postgres-integration, go-security, supply-chain, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-images-${{ github.sha }}
          path: ci-images
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$RUNNER_TEMP/ghcr-auth
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish tested images and record immutable digests
        shell: bash
        run: |
          set -euo pipefail
          docker load --input ci-images/images.tar.gz
          repository=${GITHUB_REPOSITORY,,}
          jq -n --arg revision "$GITHUB_SHA" --arg repository "$repository" '{
            schema_version: 1,
            revision: $revision,
            repository: $repository,
            platform: "linux/amd64",
            images: {}
          }' > deployment-images.json
          for service in gateway codex-compat account-egress; do
            local_image=$(jq -er --arg service "$service" '.[$service]' ci-images/local-images.json)
            remote_image=ghcr.io/$repository/$service
            remote_tag=$remote_image:sha-$GITHUB_SHA
            docker tag "$local_image" "$remote_tag"
            docker push "$remote_tag"
            digest_ref=$(docker image inspect "$remote_tag" --format '{{json .RepoDigests}}' |
              jq -er --arg prefix "$remote_image@sha256:" \
                '[.[] | select(startswith($prefix))] | if length == 1 then .[0] else error("missing or ambiguous registry digest") end')
            jq --arg service "$service" --arg image "$digest_ref" \
              '.images[$service] = $image' deployment-images.json > deployment-images.next.json
            mv deployment-images.next.json deployment-images.json
          done
          {
            printf 'Published images for commit `%s` (linux/amd64).\n\n' "$GITHUB_SHA"
            jq -r '.images | to_entries[] | "- `" + .key + "`: `" + .value + "`"' deployment-images.json
            printf '\nDownload the deployment-images artifact and follow docs/ci-image-deployment.md.\n'
            printf '\nFor anonymous pulls, set all three GHCR packages to Public after the first publication.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deployment manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-images-${{ github.sha }}
          path: deployment-images.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
