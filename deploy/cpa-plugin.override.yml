# Run unmodified CPA with the Gateway plugin instead of the source-patched
# image. Both services must switch together: the Gateway then attributes each
# dispatch through its request ledger and reaches the account routes behind
# CPA's management key.
#
#   ./scripts/compose.sh -f deploy/cpa-plugin.override.yml up -d --build gateway codex-compat
#
# Dropping this file returns to the source-patched image. The account control
# and identity documents in the credential volume use the same format in both.
# Not a default yet: see docs/compatibility-upgrades.md for what the plugin
# does not serve.
services:
  gateway:
    environment:
      CPA_INTEGRATION: plugin

  codex-compat:
    image: codex-gateway-compat:v8.0.59-c5251b57-8f3381084e4e1055-plugin
    build:
      context: .
      dockerfile: deploy/codex-compat/plugin.Dockerfile
      args:
        CLIPROXY_VERSION: v8.0.59
        CLIPROXY_COMMIT: c5251b57b3fa5dcbc689f514f4aa166daacb4481
        CLIPROXY_RESIDUAL_PATCH_SHA256: 8f3381084e4e10557aebcc089e171bfb833e88a041f6c1972774dfc4b2ec7b1a
    environment:
      # CPA maps a plugin from a private copy under its temporary directory.
      # /tmp is noexec and too small for that, so the copy gets its own tmpfs.
      TMPDIR: /run/cliproxy-plugin
    tmpfs:
      - /run/cliproxy-plugin:rw,exec,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
