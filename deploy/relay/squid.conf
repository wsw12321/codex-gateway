# Bind only to B's WireGuard address; no public listener or TLS interception.
http_port 10.77.0.2:3128

acl CONNECT method CONNECT
acl TLS_port port 443
acl relay_clients src 10.77.0.1/32
# -n prohibits reverse-DNS lookup of literal IP destinations.
acl codex_upstreams dstdomain -n auth.openai.com chatgpt.com

http_access deny !CONNECT
http_access deny !TLS_port
http_access allow CONNECT relay_clients codex_upstreams
http_access deny all

forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Forwarded deny all
cache deny all
# Only CONNECT destination, status and forwarding metadata; no TLS content or
# authentication headers. The pinned image tails this file to container logs.
logformat relay_connect %ts.%03tu %ru %>Hs %Ss/%Sh %<a
access_log stdio:/var/log/squid/access.log relay_connect CONNECT
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
shutdown_lifetime 2 seconds
