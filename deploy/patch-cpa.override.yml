# Rollback to the source-patched CPA image. Do not pass this file with -f:
# set CPA_INTEGRATION=patch in .env and every scripts/compose.sh call adds it,
# so login helpers and later `up` commands stay on the rollback image. Both
# services switch together: the Gateway's integration must match the image.
#
# Kept for the rollback window after plugin mode became the default; it is
# removed together with the source patch once real-account acceptance has
# held (docs/cpa-plugin-roadmap.md, step 8). The credential volume is shared:
# account control and identity documents use the same format in both images.
# Claude accounts and e-mail-keyed Antigravity accounts registered in plugin
# mode are not usable on this image.
services:
  gateway:
    environment:
      CPA_INTEGRATION: patch

  codex-compat:
    image: codex-gateway-compat:v8.0.59-c5251b57-f6d25e7f06e22777-cpa
    build:
      context: .
      dockerfile: deploy/codex-compat/Dockerfile
      args:
        CLIPROXY_VERSION: v8.0.59
        CLIPROXY_COMMIT: c5251b57b3fa5dcbc689f514f4aa166daacb4481
        CLIPROXY_PATCH_SHA256: f6d25e7f06e227775a3edaeff53341600b39696db1b94fc664cab0f91500233e
    environment:
      # The source-patched image routes through CPA's own global proxy.
      HTTP_PROXY: http://egress-allowlist:3128
      HTTPS_PROXY: http://egress-allowlist:3128
      ALL_PROXY: http://egress-allowlist:3128
      # The plugin tmpfs stays mounted but unused: temporary files go to the
      # noexec /tmp as before.
      TMPDIR: /tmp
