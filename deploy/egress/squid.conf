http_port 3128

# Only HTTPS CONNECT to the two exact upstream hostnames is permitted. Leading
# dots are deliberately omitted so arbitrary subdomains do not match.
acl CONNECT method CONNECT
acl TLS_port port 443
acl codex_upstreams dstdomain auth.openai.com chatgpt.com

http_access deny !CONNECT
http_access deny !TLS_port
http_access allow CONNECT codex_upstreams
http_access deny all

# Do not disclose the gateway's internal addressing. CONNECT hides request
# paths and credentials from Squid; logs contain destination and status only.
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Forwarded deny all

cache deny all
access_log none
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
shutdown_lifetime 2 seconds
