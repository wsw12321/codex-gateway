http_port 3128

# Only HTTPS CONNECT to exact upstream hostnames is permitted. No leading dots
# or wildcard Google domains: subdomains require separate review.
acl CONNECT method CONNECT
acl TLS_port port 443
# Provider egress belongs only to the two upstream containers. Gateway's
# optional OIDC rule is independent and cannot inherit model-provider egress.
acl codex_clients src 172.28.30.3/32
acl antigravity_clients src 172.28.40.3/32
acl gateway_oidc_clients src 172.28.30.2/32
# -n prevents literal IP requests from matching via reverse DNS.
acl codex_upstreams dstdomain -n auth.openai.com chatgpt.com
# CPA native Google OAuth and Cloud Code execution destinations, pinned to v8.
acl cpa_google_upstreams dstdomain -n accounts.google.com oauth2.googleapis.com www.googleapis.com cloudcode-pa.googleapis.com daily-cloudcode-pa.googleapis.com daily-cloudcode-pa.sandbox.googleapis.com
acl cpa_anthropic_upstreams dstdomain -n platform.claude.com api.anthropic.com
# Retained Google OAuth/Cloud Code baseline from the previous deployment.
# Authenticated agy acceptance must review observed CONNECT destinations;
# denied destinations are never automatically promoted into this list.
acl antigravity_upstreams dstdomain -n accounts.google.com oauth2.googleapis.com www.googleapis.com cloudcode-pa.googleapis.com daily-cloudcode-pa.googleapis.com aicode.googleapis.com businessaicode.googleapis.com generativelanguage.googleapis.com lh3.googleusercontent.com antigravity-unleash.goog play.googleapis.com playwright.azureedge.net playwright-akamai.azureedge.net playwright-verizon.azureedge.net

# The startup wrapper always creates this include, including when relay is off.
# An enabled relay applies to both upstream containers and forbids direct fallback.
include /run/codex-relay.conf

http_access deny !CONNECT
http_access deny !TLS_port
# Empty unless the optional OIDC deployment is enabled. Its sole destination
# is the exact configured Auth hostname; it never uses the model relay.
include /run/gateway-oidc.conf
http_access allow CONNECT codex_clients codex_upstreams
http_access allow CONNECT codex_clients cpa_google_upstreams
http_access allow CONNECT codex_clients cpa_anthropic_upstreams
http_access allow CONNECT antigravity_clients antigravity_upstreams
http_access deny all

forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Forwarded deny all
cache deny all
# CONNECT exposes only a destination authority, never TLS paths or content.
# The hierarchy code and selected peer IP distinguish direct and relay egress.
logformat bridge_destinations %ts.%03tu %ru %>Hs %Sh/%<a
access_log stdio:/var/log/squid/access.log bridge_destinations CONNECT antigravity_clients
logformat codex_destinations %ts.%03tu %ru %>Hs %Sh/%<a
access_log stdio:/var/log/squid/access.log codex_destinations CONNECT codex_clients
logformat gateway_oidc_destinations %ts.%03tu %ru %>Hs %Sh/%<a
access_log stdio:/var/log/squid/access.log gateway_oidc_destinations CONNECT gateway_oidc_clients
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
shutdown_lifetime 2 seconds
