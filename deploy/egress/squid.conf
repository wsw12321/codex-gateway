http_port 3128

# Only HTTPS CONNECT to exact upstream hostnames is permitted. No leading dots
# or wildcard Google domains: subdomains require separate review.
acl CONNECT method CONNECT
acl TLS_port port 443
# Match only the two upstream containers. Gateway also joins these internal
# networks, but it must not inherit either provider's Internet egress.
acl codex_clients src 172.28.30.3/32
acl antigravity_clients src 172.28.40.3/32
acl codex_upstreams dstdomain auth.openai.com chatgpt.com
# Retained Google OAuth/Cloud Code baseline from the previous deployment.
# Authenticated agy acceptance must review observed CONNECT destinations;
# denied destinations are never automatically promoted into this list.
acl antigravity_upstreams dstdomain accounts.google.com oauth2.googleapis.com www.googleapis.com cloudcode-pa.googleapis.com daily-cloudcode-pa.googleapis.com aicode.googleapis.com businessaicode.googleapis.com generativelanguage.googleapis.com lh3.googleusercontent.com antigravity-unleash.goog play.googleapis.com playwright.azureedge.net playwright-akamai.azureedge.net playwright-verizon.azureedge.net

# The startup wrapper always creates this include, including when relay is off.
# An enabled relay applies only to codex_clients and forbids direct fallback.
include /run/codex-relay.conf

http_access deny !CONNECT
http_access deny !TLS_port
http_access allow CONNECT codex_clients codex_upstreams
http_access allow CONNECT antigravity_clients antigravity_upstreams
http_access deny all

forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Forwarded deny all
cache deny all
# CONNECT records contain only timestamp, destination and status, never TLS
# paths, bodies or headers. This supports the real-account egress acceptance.
logformat bridge_destinations %ts.%03tu %ru %>Hs
# access_log stdio:/dev/stdout bridge_destinations CONNECT antigravity_clients
access_log stdio:/var/log/squid/access.log bridge_destinations CONNECT antigravity_clients
# CONNECT exposes only a destination authority, never TLS paths or content.
# The hierarchy code and selected peer IP distinguish direct and relay egress.
logformat codex_destinations %ts.%03tu %ru %>Hs %Sh/%<a
access_log stdio:/var/log/squid/access.log codex_destinations CONNECT codex_clients
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
shutdown_lifetime 2 seconds
