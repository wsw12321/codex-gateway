<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>吾水阁账号授权 · Codex Gateway</title>
  <script src="/static/oidc-callback.js" defer></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-shell">
    <section class="panel auth-card" aria-labelledby="oidc-title">
      <p class="eyebrow">IDENTITY</p>
      <h1 id="oidc-title">吾水阁账号授权</h1>
      <p id="oidc-message" role="status" aria-live="polite">正在验证授权结果…</p>
      <div id="oidc-registration" class="hidden">
        <p id="oidc-registration-account"></p>
        <p>你可以绑定已有本站账号，或直接开通一个普通会员账号。新账号余额为零；密码和 Passkey 均可稍后按需添加。</p>
        <div class="button-row">
          <button id="oidc-register-link" type="button" class="secondary">绑定已有账号</button>
          <button id="oidc-register-create" type="button">不绑定，直接创建账号</button>
          <button id="oidc-register-cancel" type="button" class="secondary">取消开通</button>
        </div>
        <form id="oidc-register-form" class="hidden">
          <h2>设置个人资料</h2>
          <label>用户名<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="oidc-username-help"></label>
          <p id="oidc-username-help" class="muted">3–32 位，以英文字母开头，仅含字母、数字、_ 或 -，不区分大小写且不能重名。</p>
          <label>显示名称<input name="display_name" autocomplete="nickname" required aria-describedby="oidc-display-help"></label>
          <p id="oidc-display-help" class="muted">去除首尾空白后为 1–80 个字符，支持中文，可以重名。</p>
          <p id="oidc-register-message" class="form-message hidden" role="alert" aria-live="polite"></p>
          <button id="oidc-register-submit" type="submit">确认创建账号</button>
        </form>
        <p id="oidc-registration-expiry" class="muted"></p>
      </div>
      <div id="oidc-preview" class="hidden">
        <p id="oidc-accounts"></p>
        <p>确认后可使用该吾水阁账号登录原网关账号。请核对两个账号；如有误，请取消并重新开始。</p>
        <p id="oidc-expiry" class="muted"></p>
        <div class="button-row">
          <button id="oidc-confirm" type="button">确认绑定</button>
          <button id="oidc-cancel" type="button" class="secondary">取消绑定</button>
        </div>
      </div>
      <p><a id="oidc-return" href="/#security">返回网关</a></p>
    </section>
  </main>
</body>
</html>
